components:
  schemas:
    Members:
      type: array
      items:
        $ref: '#/components/schemas/Member'
    ListGroupMembersResponse:
      type: object
      properties:
        Members:
          allOf:
          - $ref: '#/components/schemas/Members'
          - description: The members associated to the group.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/NextToken'
          - description: The token to use to retrieve the next page of results. The first call does not contain any tokens.
    MaxResults:
      type: integer
      minimum: 1
      maximum: 100
    MemberType:
      type: string
      enum:
      - GROUP
      - USER
    EntityState:
      type: string
      enum:
      - ENABLED
      - DISABLED
      - DELETED
    ListGroupMembersRequest:
      type: object
      required:
      - OrganizationId
      - GroupId
      title: ListGroupMembersRequest
      properties:
        OrganizationId:
          allOf:
          - $ref: '#/components/schemas/OrganizationId'
          - description: The identifier for the organization under which the group exists.
        GroupId:
          allOf:
          - $ref: '#/components/schemas/WorkMailIdentifier'
          - description: The identifier for the group to which the members (users or groups) are associated.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/NextToken'
          - description: ' The token to use to retrieve the next page of results. The first call does not contain any tokens.'
        MaxResults:
          allOf:
          - $ref: '#/components/schemas/MaxResults'
          - description: The maximum number of results to return in a single call.
    Timestamp:
      type: string
      format: date-time
    InvalidParameterException: {}
    OrganizationId:
      type: string
      pattern: ^m-[0-9a-f]{32}$
      minLength: 34
      maxLength: 34
    NextToken:
      type: string
      pattern: '[\S\s]*|[a-zA-Z0-9/+=]{1,1024}'
      minLength: 1
      maxLength: 1024
    EntityNotFoundException: {}
    Member:
      type: object
      properties:
        Id:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The identifier of the member.
        Name:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The name of the member.
        Type:
          allOf:
          - $ref: '#/components/schemas/MemberType'
          - description: A member can be a user or group.
        State:
          allOf:
          - $ref: '#/components/schemas/EntityState'
          - description: The state of the member, which can be ENABLED, DISABLED, or DELETED.
        EnabledDate:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The date indicating when the member was enabled for WorkMail use.
        DisabledDate:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The date indicating when the member was disabled from WorkMail use.
      description: The representation of a user or group.
    EntityStateException: {}
    OrganizationNotFoundException: {}
    OrganizationStateException: {}
    WorkMailIdentifier:
      type: string
      minLength: 12
      maxLength: 256
    String:
