components:
  schemas:
    User:
      type: object
      properties:
        Id:
          allOf:
          - $ref: '#/components/schemas/WorkMailIdentifier'
          - description: The identifier of the user.
        Email:
          allOf:
          - $ref: '#/components/schemas/EmailAddress'
          - description: The email of the user.
        Name:
          allOf:
          - $ref: '#/components/schemas/UserName'
          - description: The name of the user.
        DisplayName:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The display name of the user.
        State:
          allOf:
          - $ref: '#/components/schemas/EntityState'
          - description: The state of the user, which can be ENABLED, DISABLED, or DELETED.
        UserRole:
          allOf:
          - $ref: '#/components/schemas/UserRole'
          - description: The role of the user.
        EnabledDate:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The date indicating when the user was enabled for WorkMail use.
        DisabledDate:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The date indicating when the user was disabled from WorkMail use.
      description: The representation of an WorkMail user.
    CreateResourceResponse:
      type: object
      properties:
        ResourceId:
          allOf:
          - $ref: '#/components/schemas/ResourceId'
          - description: The identifier of the new resource.
    PutRetentionPolicyResponse:
      type: object
      properties: {}
    DescribeEmailMonitoringConfigurationRequest:
      type: object
      required:
      - OrganizationId
      title: DescribeEmailMonitoringConfigurationRequest
      properties:
        OrganizationId:
          allOf:
          - $ref: '#/components/schemas/OrganizationId'
          - description: The ID of the organization for which the email monitoring configuration is described.
    DescribeInboundDmarcSettingsRequest:
      type: object
      required:
      - OrganizationId
      title: DescribeInboundDmarcSettingsRequest
      properties:
        OrganizationId:
          allOf:
          - $ref: '#/components/schemas/OrganizationId'
          - description: Lists the ID of the given organization.
