security:
- hmac: []
tags:
- name: '#X Amz Target=WorkMailService.ListImpersonationRoles'
paths:
  /#X-Amz-Target=WorkMailService.ListImpersonationRoles:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: ListImpersonationRoles
      description: Lists all the impersonation roles for the given WorkMail organization.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListImpersonationRolesResponse'
        '480':
          description: InvalidParameterException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterException'
        '481':
          description: OrganizationNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationNotFoundException'
        '482':
          description: OrganizationStateException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationStateException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListImpersonationRolesRequest'
      parameters:
      - name: MaxResults
        in: query
        schema:
          type: string
        description: Pagination limit
        required: false
      - name: NextToken
        in: query
        schema:
          type: string
        description: Pagination token
        required: false
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - WorkMailService.ListImpersonationRoles
      summary: Amazon WorkMail List Impersonation Roles
      tags:
      - '#X Amz Target=WorkMailService.ListImpersonationRoles'
components:
  schemas:
    ImpersonationRole:
      type: object
      properties:
        ImpersonationRoleId:
          allOf:
          - $ref: '#/components/schemas/ImpersonationRoleId'
          - description: The identifier of the impersonation role.
        Name:
          allOf:
          - $ref: '#/components/schemas/ImpersonationRoleName'
          - description: The impersonation role name.
        Type:
          allOf:
          - $ref: '#/components/schemas/ImpersonationRoleType'
          - description: The impersonation role type.
        DateCreated:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The date when the impersonation role was created.
        DateModified:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The date when the impersonation role was last modified.
      description: An impersonation role for the given WorkMail organization.
    MaxResults:
      type: integer
      minimum: 1
      maximum: 100
    Timestamp:
      type: string
      format: date-time
    InvalidParameterException: {}
    OrganizationId:
      type: string
      pattern: ^m-[0-9a-f]{32}$
      minLength: 34
      maxLength: 34
    NextToken:
      type: string
      pattern: '[\S\s]*|[a-zA-Z0-9/+=]{1,1024}'
      minLength: 1
      maxLength: 1024
    ImpersonationRoleType:
      type: string
      enum:
      - FULL_ACCESS
      - READ_ONLY
    ListImpersonationRolesResponse:
      type: object
      properties:
        Roles:
          allOf:
          - $ref: '#/components/schemas/ImpersonationRoleList'
          - description: The list of impersonation roles under the given WorkMail organization.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/NextToken'
          - description: The token to retrieve the next page of results. The value is <code>null</code> when there are no results to return.
    ImpersonationRoleName:
      type: string
      pattern: '[^\x00-\x1F\x7F\x3C\x3E\x5C]+'
      minLength: 1
      maxLength: 64
    ImpersonationRoleId:
      type: string
      pattern: '[a-zA-Z0-9_-]+'
      minLength: 1
      maxLength: 64
    OrganizationNotFoundException: {}
    ImpersonationRoleList:
      type: array
      items:
        $ref: '#/components/schemas/ImpersonationRole'
      minItems: 0
      maxItems: 20
    OrganizationStateException: {}
    ListImpersonationRolesRequest:
      type: object
      required:
      - OrganizationId
      title: ListImpersonationRolesRequest
      properties:
        OrganizationId:
          allOf:
          - $ref: '#/components/schemas/OrganizationId'
          - description: The WorkMail organization to which the listed impersonation roles belong.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/NextToken'
          - description: The token used to retrieve the next page of results. The first call doesn't require a token.
        MaxResults:
          allOf:
          - $ref: '#/components/schemas/MaxResults'
          - description: The maximum number of results returned in a single call.
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
