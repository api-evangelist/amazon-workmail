security:
- hmac: []
tags:
- name: '#X Amz Target=WorkMailService.GetAccessControlEffect'
paths:
  /#X-Amz-Target=WorkMailService.GetAccessControlEffect:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: GetAccessControlEffect
      description: Gets the effects of an organization's access control rules as they apply to a specified IPv4 address, access protocol action, and user ID or impersonation role ID. You must provide either the user ID or impersonation role ID. Impersonation role ID can only be used with Action EWS.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAccessControlEffectResponse'
        '480':
          description: EntityNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityNotFoundException'
        '481':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '482':
          description: InvalidParameterException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterException'
        '483':
          description: OrganizationNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationNotFoundException'
        '484':
          description: OrganizationStateException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationStateException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetAccessControlEffectRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - WorkMailService.GetAccessControlEffect
      summary: Amazon WorkMail Get Access Control Effect
      tags:
      - '#X Amz Target=WorkMailService.GetAccessControlEffect'
components:
  schemas:
    AccessControlRuleName:
      type: string
      pattern: '[a-zA-Z0-9_-]+'
      minLength: 1
      maxLength: 64
    ResourceNotFoundException: {}
    AccessControlRuleNameList:
      type: array
      items:
        $ref: '#/components/schemas/AccessControlRuleName'
      minItems: 0
      maxItems: 10
    GetAccessControlEffectRequest:
      type: object
      required:
      - OrganizationId
      - IpAddress
      - Action
      title: GetAccessControlEffectRequest
      properties:
        OrganizationId:
          allOf:
          - $ref: '#/components/schemas/OrganizationId'
          - description: The identifier for the organization.
        IpAddress:
          allOf:
          - $ref: '#/components/schemas/IpAddress'
          - description: The IPv4 address.
        Action:
          allOf:
          - $ref: '#/components/schemas/AccessControlRuleAction'
          - description: The access protocol action. Valid values include <code>ActiveSync</code>, <code>AutoDiscover</code>, <code>EWS</code>, <code>IMAP</code>, <code>SMTP</code>, <code>WindowsOutlook</code>, and <code>WebMail</code>.
        UserId:
          allOf:
          - $ref: '#/components/schemas/WorkMailIdentifier'
          - description: The user ID.
        ImpersonationRoleId:
          allOf:
          - $ref: '#/components/schemas/ImpersonationRoleId'
          - description: The impersonation role ID.
    InvalidParameterException: {}
    OrganizationId:
      type: string
      pattern: ^m-[0-9a-f]{32}$
      minLength: 34
      maxLength: 34
    AccessControlRuleAction:
      type: string
      pattern: '[a-zA-Z]+'
      minLength: 1
      maxLength: 64
    GetAccessControlEffectResponse:
      type: object
      properties:
        Effect:
          allOf:
          - $ref: '#/components/schemas/AccessControlRuleEffect'
          - description: The rule effect.
        MatchedRules:
          allOf:
          - $ref: '#/components/schemas/AccessControlRuleNameList'
          - description: The rules that match the given parameters, resulting in an effect.
    EntityNotFoundException: {}
    ImpersonationRoleId:
      type: string
      pattern: '[a-zA-Z0-9_-]+'
      minLength: 1
      maxLength: 64
    IpAddress:
      type: string
      pattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$
      minLength: 1
      maxLength: 15
    OrganizationNotFoundException: {}
    OrganizationStateException: {}
    WorkMailIdentifier:
      type: string
      minLength: 12
      maxLength: 256
    AccessControlRuleEffect:
      type: string
      enum:
      - ALLOW
      - DENY
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
